<!doctype html>
<!--
  Fill Me In file picker. Hosted on GitHub Pages because the Google Picker needs a
  remote script, which MV3 extension pages may not load.

  Protocol (window.postMessage, origins checked on both sides):
    picker → opener   { type: "fillmein-picker:ready" }
    opener → picker   { type: "fillmein-picker:open", token, mimeTypes, multiselect }
    picker → opener   { type: "fillmein-picker:picked", files: [{ id, name, mimeType }] }
                    | { type: "fillmein-picker:cancelled" }
                    | { type: "fillmein-picker:error", message }
  The OAuth token is only held in memory and never stored.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fill Me In — choose a file</title>
    <style>
      body {
        font:
          15px system-ui,
          sans-serif;
        margin: 0;
        display: grid;
        place-items: center;
        min-height: 100vh;
        color: #18181b;
        background: #fafafa;
      }
    </style>
  </head>
  <body>
    <p id="status">Waiting for Fill Me In…</p>
    <script>
      // Allowed Fill Me In extension origins (dev ID; add the Web Store ID when published).
      const EXTENSION_ORIGINS = ["chrome-extension://ecpahlckhhpdkllbapnlgceafaehnolg"];
      const API_KEY = "AIzaSyAJOKJyTELUjsn0McnHEe2DUCnaXYGF0Pk";
      const APP_ID = "921593927653";

      const status = document.getElementById("status");
      const opener = window.opener;
      let openerOrigin;

      function reply(message) {
        if (opener && openerOrigin) opener.postMessage(message, openerOrigin);
      }

      function loadPickerApi() {
        return new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = "https://apis.google.com/js/api.js";
          script.onload = () => gapi.load("picker", { callback: resolve, onerror: reject });
          script.onerror = () => reject(new Error("Could not load Google Picker"));
          document.head.appendChild(script);
        });
      }

      function showPicker({ token, mimeTypes, multiselect }) {
        const view = new google.picker.DocsView(google.picker.ViewId.DOCS)
          .setIncludeFolders(true)
          .setSelectFolderEnabled(false);
        if (mimeTypes) view.setMimeTypes(mimeTypes);

        const builder = new google.picker.PickerBuilder()
          .addView(view)
          .setOAuthToken(token)
          .setDeveloperKey(API_KEY)
          .setAppId(APP_ID)
          .setTitle("Choose a file for Fill Me In")
          .setCallback((data) => {
            const action = data[google.picker.Response.ACTION];
            if (action === google.picker.Action.PICKED) {
              const files = data[google.picker.Response.DOCUMENTS].map((d) => ({
                id: d[google.picker.Document.ID],
                name: d[google.picker.Document.NAME],
                mimeType: d[google.picker.Document.MIME_TYPE],
              }));
              reply({ type: "fillmein-picker:picked", files });
              window.close();
            } else if (action === google.picker.Action.CANCEL) {
              reply({ type: "fillmein-picker:cancelled" });
              window.close();
            }
          });
        if (multiselect) builder.enableFeature(google.picker.Feature.MULTISELECT_ENABLED);
        builder.build().setVisible(true);
        status.textContent = "";
      }

      window.addEventListener("message", (event) => {
        if (event.source !== opener || !EXTENSION_ORIGINS.includes(event.origin)) return;
        if (event.data?.type !== "fillmein-picker:open" || typeof event.data.token !== "string") return;
        openerOrigin = event.origin;
        loadPickerApi()
          .then(() => showPicker(event.data))
          .catch((e) => {
            status.textContent = "Couldn't load the Google file picker.";
            reply({ type: "fillmein-picker:error", message: String(e) });
          });
      });

      if (!opener) {
        status.textContent = "Open this page from the Fill Me In extension.";
      } else {
        // The opener's origin is unknown until it replies, so announce to each allowed origin.
        for (const origin of EXTENSION_ORIGINS) opener.postMessage({ type: "fillmein-picker:ready" }, origin);
      }
    </script>
  </body>
</html>
